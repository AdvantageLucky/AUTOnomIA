name: kigo_salida
description: "Kiosko de salida AUTOnomIA -- tap + foto de rostro, bitácora de tipo SALIDA."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.1.2
  camera: ^0.12.0
  google_mlkit_face_detection: ^0.11.0
  image: ^4.9.1
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Empaquetadas como asset local, mismo criterio que kiosko/pubspec.yaml:
  # sin depender de que el venue tenga wifi para bajar la fuente en runtime.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

name: Build kigo-app APK

# Compila el APK de release de kigo-app y lo publica como asset de un
# release fijo (tag "kigo-app-latest") — da una URL de descarga estable
# para el QR del stand, sin tener que compilar a mano cada vez que cambia
# algo. Firma con la keystore de debug (no hay Play Store de por medio,
# es distribución directa para FEPRO).
#
# runs-on: ubuntu-latest es una máquina nueva en cada corrida -- sin el
# paso de abajo, Android genera un keystore de debug ALEATORIO distinto
# en cada build, y quien ya tenía instalado un build anterior no puede
# instalar el nuevo encima ("app no instalada, conflicto de paquete").
# Se usa siempre el mismo keystore fijo (.github/keystores/debug.keystore,
# con los valores convencionales storepass/keypass "android" y alias
# "androiddebugkey" que Gradle ya asume por default) para que todos los
# builds de kigo-app-latest compartan la misma firma.
on:
  push:
    branches: [dev]
    paths:
      - "kigo-app/**"
      - ".github/workflows/build-kigo-app.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Usar keystore de debug fijo (misma firma en cada build)
        run: |
          mkdir -p ~/.android
          cp .github/keystores/debug.keystore ~/.android/debug.keystore

      - name: Instalar dependencias
        working-directory: kigo-app
        run: flutter pub get

      - name: Compilar APK de release
        working-directory: kigo-app
        run: flutter build apk --release

      - name: Publicar como release "kigo-app-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kigo-app-latest
          name: Kigo App — última build
          body: |
            Build automático desde el commit ${{ github.sha }}.
            Descarga: kigo-app-release.apk — instalación directa (fuentes desconocidas), no viene de Play Store.
          prerelease: true
          files: kigo-app/build/app/outputs/flutter-apk/app-release.apk

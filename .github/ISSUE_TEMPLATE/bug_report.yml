name: Bug Report
description: Reportar un comportamiento incorrecto
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Template generada para bugs. Llena los campos"

  - type: textarea
    id: description
    attributes:
      label: ¿Qué está pasando?
      description: Comportamiento actual vs comportamiento esperado.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Hacer X
        2. Llamar endpoint Y con payload Z
        3. Ver error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto - Entorno
      placeholder: |
        - OS / versión

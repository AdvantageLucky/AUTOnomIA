name: kigo_user
description: "AUTOnomIA — app de residentes para el control de acceso de Kigo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  provider: ^6.1.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  http: ^1.2.1
  http_parser: ^4.1.2
  dio: ^5.4.3+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  tflite_flutter: ^0.12.1
  image: ^4.9.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  webview_flutter: ^4.14.1
  app_links: ^6.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

# Ícono de app: la marca AUTOnomIA (fondo naranja de marca + isotipo blanco),
# usada tal cual como imagen fuente -- ya es cuadrada (1024x1024) y a pantalla
# completa, sin recorte adaptativo (no hay versión con fondo transparente).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_autonomia.jpg"
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/icon/icon_autonomia.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilefacenet.tflite

  # Empaquetadas como asset local (no via google_fonts en runtime) para que
  # nunca dependan de la red del teléfono del residente.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf